{% extends 'base.html' %}

{% block title %}Page Not Found (404) — FixMate{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="py-5">
    <div class="bg-primary-subtle text-primary rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 80px; height: 80px;">
      <i class="bi bi-search fs-1"></i>
    </div>
    <h1 class="display-4 fw-bold">404</h1>
    <h3 class="fw-bold mb-2">Page Not Found</h3>
    <p class="text-muted small mb-4">The page or service you are searching for does not exist or has been relocated.</p>
    <a href="{{ url_for('main.index') }}" class="btn btn-primary rounded-pill px-4">
      <i class="bi bi-house me-1"></i> Return Home
    </a>
  </div>
</div>
{% endblock %}
