{% extends 'base.html' %}

{% block title %}Server Error (500) — FixMate{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="py-5">
    <div class="bg-warning text-dark rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 80px; height: 80px;">
      <i class="bi bi-tools fs-1"></i>
    </div>
    <h1 class="display-4 fw-bold">500</h1>
    <h3 class="fw-bold mb-2">Unexpected Server Error</h3>
    <p class="text-muted small mb-4">Something went wrong while processing your request. The database transaction was rolled back safely.</p>
    <a href="{{ url_for('main.index') }}" class="btn btn-primary rounded-pill px-4">
      <i class="bi bi-house me-1"></i> Return Home
    </a>
  </div>
</div>
{% endblock %}
