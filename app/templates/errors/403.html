{% extends 'base.html' %}

{% block title %}Access Denied (403) — FixMate{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="py-5">
    <div class="bg-danger text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 80px; height: 80px;">
      <i class="bi bi-shield-x fs-1"></i>
    </div>
    <h1 class="display-4 fw-bold">403</h1>
    <h3 class="fw-bold mb-2">Access Denied</h3>
    <p class="text-muted small mb-4">You do not have permission to access this resource or administrative role.</p>
    <a href="{{ url_for('main.index') }}" class="btn btn-primary rounded-pill px-4">
      <i class="bi bi-house me-1"></i> Return to Safety
    </a>
  </div>
</div>
{% endblock %}
