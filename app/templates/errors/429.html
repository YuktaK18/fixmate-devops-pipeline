{% extends 'base.html' %}

{% block title %}Too Many Requests (429) — FixMate{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="py-5">
    <div class="bg-warning text-dark rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 80px; height: 80px;">
      <i class="bi bi-speedometer fs-1"></i>
    </div>
    <h1 class="display-4 fw-bold">429</h1>
    <h3 class="fw-bold mb-2">Too Many Requests</h3>
    <p class="text-muted small mb-4">You have exceeded the rate limit for this action. Please pause for a moment before trying again.</p>
    <a href="{{ url_for('main.index') }}" class="btn btn-primary rounded-pill px-4">
      <i class="bi bi-house me-1"></i> Return Home
    </a>
  </div>
</div>
{% endblock %}
